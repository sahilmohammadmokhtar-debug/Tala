<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی کسب درآمد</title>
    <style>
        body {
            background-color: #1c1c1e;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .score-container {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .click-btn {
            background-color: #f1c40f;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px #d4ac0d;
            width: 150px;
            height: 150px;
        }
        .click-btn:active {
            box-shadow: 0 5px #d4ac0d;
            transform: translateY(5px);
        }
    </style>
</head>
<body>

    <h1>به بازی کسب درآمد خوش آمدید</h1>
    
    <div class="score-container">
        تعداد سکه‌ها: <span id="score">0</span>
    </div>

    <button class="click-btn" id="clickBtn">کلیک کن</button>

    <script>
        let count = 0;
        const scoreElement = document.getElementById('score');
        const buttonElement = document.getElementById('clickBtn');

        buttonElement.addEventListener('click', () => {
            count++;
            scoreElement.innerText = count;
        });
    </script>

</body>
</html>
