<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بازی کسب درآمد من</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: sans-serif; padding-top: 50px; }
        button { background: #2ecc71; border: none; padding: 15px 30px; font-size: 20px; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>به بازی من خوش آمدید!</h1>
    <p style="font-size: 24px;">تعداد سکه‌ها: <span id="score" style="color: #f1c40f;">0</span></p>
    <button onclick="document.getElementById('score').innerText++">کلیک کن و سکه بگیر! 🪙</button>
</body>
</html>
